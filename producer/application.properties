# Kafka Producer Application Configuration
# This file contains default configuration values that can be overridden by environment variables

# Application Information
app.name=kafka-producer
app.version=@project.version@
app.description=Configurable Kafka Producer Application

# Kafka Configuration
kafka.bootstrap.servers=localhost:9092
kafka.topic.name=user-events
kafka.producer.client.id=kafka-producer-${random.uuid}

# Producer Behavior Configuration
producer.interval.ms=5000
producer.batch.size=16384
producer.linger.ms=10
producer.buffer.memory=33554432
producer.retries=3
producer.retry.backoff.ms=100
producer.request.timeout.ms=30000
producer.delivery.timeout.ms=120000

# Message Configuration
message.format=json
message.key.prefix=key_
message.compression.type=snappy

# Monitoring and Metrics
metrics.enabled=true
metrics.recording.level=INFO
metrics.sample.window.ms=30000
metrics.num.samples=2

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.kafka.producer=INFO
logging.level.org.apache.kafka=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Security Configuration (for production)
security.protocol=PLAINTEXT
sasl.mechanism=PLAIN
sasl.jaas.config=

# SSL Configuration (when using SSL)
ssl.keystore.location=
ssl.keystore.password=
ssl.truststore.location=
ssl.truststore.password=
ssl.key.password=

# Schema Registry Configuration (if using Avro)
schema.registry.url=http://localhost:8081
schema.registry.basic.auth.user.info=

# Producer Performance Tuning
producer.acks=all
producer.enable.idempotence=true
producer.max.in.flight.requests.per.connection=5
producer.transactional.id=

# Error Handling
producer.send.timeout.ms=60000
producer.max.block.ms=60000

# Development/Debug Settings
debug.enabled=false
debug.log.message.content=false
debug.log.producer.config=false

# Health Check Configuration
health.check.enabled=true
health.check.interval.ms=30000
health.check.timeout.ms=5000

# Environment-specific overrides
# These can be overridden by setting environment variables
# Environment variables should be in UPPER_CASE with underscores
# For example: KAFKA_BOOTSTRAP_SERVERS, KAFKA_TOPIC_NAME, etc.

